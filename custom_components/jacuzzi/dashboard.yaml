# Jacuzzi dashboard — yaml-mode panel, meegeleverd door de integratie.
# Niet bewerkbaar in de UI; updatet automatisch mee met HACS-releases.
title: Jacuzzi
views:
  - title: Jacuzzi
    path: jacuzzi
    icon: mdi:hot-tub
    cards:
      - type: horizontal-stack
        cards:
          - type: thermostat
            entity: climate.jaccuzzi_thermostat_1
            name: Kuip
          - type: thermostat
            entity: climate.pool_heat_pump
            name: Poolex

      - type: horizontal-stack
        cards:
          - type: glance
            title: Gecko — circulatie
            entities:
              - entity: fan.jaccuzzi_waterfall
                name: Circulatie
              - entity: binary_sensor.jacuzzi_pump_started_by_ha
                name: Pomp door HA
          - type: glance
            title: Poolex — warmtepomp
            entities:
              - entity: switch.jacuzzi_poolex_power
                name: Aan/uit
              - entity: binary_sensor.jacuzzi_heat_demand
                name: Warmtevraag
              - entity: sensor.pool_heat_pump_compressor_duty_cycle
                name: Compressor
              - entity: binary_sensor.pool_heat_pump_problem
                name: Fault

      - type: history-graph
        title: Temperaturen (2 dagen)
        hours_to_show: 48
        entities:
          - entity: sensor.jacuzzi_tub_temperature
            name: Kuip
          - entity: sensor.pool_heat_pump_temperature
            name: Wisselaar inlaat
          - entity: sensor.pool_heat_pump_outflow_temperature
            name: Uitlaat
          - entity: sensor.pool_heat_pump_vent_temperature
            name: Heetgas
          - entity: sensor.pool_heat_pump_coil_temperature
            name: Verdamper
          - entity: sensor.pool_heat_pump_temperature_2
            name: Buiten

      - type: history-graph
        title: Aan/uit (2 dagen)
        hours_to_show: 48
        entities:
          - entity: fan.jaccuzzi_waterfall
            name: Circulatie
          - entity: fan.jaccuzzi_pump_1
            name: Massagepomp 1
          - entity: fan.jaccuzzi_pump_2
            name: Massagepomp 2
          - entity: binary_sensor.jacuzzi_pump_started_by_ha
            name: Pomp door HA
          - entity: binary_sensor.jacuzzi_heat_demand
            name: Warmtevraag
          - entity: binary_sensor.pool_heat_pump_defrost
            name: Defrost
          - entity: sensor.pool_heat_pump_compressor_duty_cycle
            name: Compressor %
          - entity: sensor.pool_heat_pump_fan_speed
            name: Ventilator (rpm)

      - type: entities
        title: Piekblokkade
        entities:
          - entity: time.jacuzzi_peak_start
            name: Start
          - entity: time.jacuzzi_peak_end
            name: Einde
          - entity: number.jacuzzi_solar_surplus_threshold
            name: PV-drempel
          - entity: select.jaccuzzi_watercare_mode
            name: Watercare (piek = Super Savings)

      - type: entities
        title: Verbruik
        show_header_toggle: false
        entities:
          - entity: sensor.jacuzzi_poolex_energy
            name: Poolex (kWh)
          - entity: sensor.jacuzzi_energy
            name: Jacuzzi (kWh)

      - type: entities
        title: Poolex — sturing
        show_header_toggle: false
        entities:
          - entity: select.pool_heat_pump_auxiliary_heating
            name: Bijstook (C4)
          - entity: select.pool_heat_pump_circulation_pump
            name: Pomprelais (C8)
          - entity: switch.pool_heat_pump_defrost
            name: Defrost (handmatig)
          - entity: binary_sensor.pool_heat_pump_defrost
            name: Defrost actief
          - entity: number.pool_heat_pump_sampling_interval
            name: Meetinterval (C9)
          - entity: switch.jacuzzi_poolex_always_on
            name: Altijd aan (vorstbeveiliging)

      - type: entities
        title: Gecko — kuip
        show_header_toggle: false
        entities:
          - entity: fan.jaccuzzi_waterfall
            name: Circulatiepomp
          - entity: fan.jaccuzzi_pump_1
            name: Massagepomp 1
          - entity: fan.jaccuzzi_pump_2
            name: Massagepomp 2
          - entity: light.jaccuzzi_light_1
            name: Verlichting
          - entity: select.jaccuzzi_watercare_mode
            name: Watercare
          - entity: binary_sensor.jaccuzzi_spa_status
            name: Spa status

      - type: markdown
        title: Hoe de regeling werkt
        content: >-
          **Warmtevraag** = kuip-temperatuur (Gecko) < Poolex-setpoint − 1 °C.
          Dan zet HA de circulatiepomp aan; de Poolex start de compressor zelf
          zodra er flow is. Pomp gaat uit 3 min nadat het setpoint bereikt is.

          **Piekblokkade**: tussen start/einde → setpoint 15 °C + Watercare
          Super Savings. PV-overschot ≥ drempel gedurende 10 min → vervroegd
          einde. De blokkade herstelt zichzelf ook als HA een grens mist.

          **Poolex altijd aan**: buiten de piek wordt hvac 'off' na 60 s
          teruggezet naar heat — vorstbeveiliging van de unit werkt alleen in
          standby. Zet deze switch uit bij onderhoud/winterstalling.

          **Failsafe**: compressor aan zonder flow → pomp direct weer aan.
          De hardware flow-beveiliging van de Poolex blijft altijd achtervang.
