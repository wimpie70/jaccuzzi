title: Jacuzzi
button_card_templates:
  jac_row:
    show_icon: true
    show_state: true
    layout: icon_name_state
    tap_action:
      action: more-info
    styles:
      card:
        - padding: 12px 16px
        - border-radius: 12px
  jac_toggle:
    show_icon: true
    show_state: true
    layout: icon_name_state
    tap_action:
      action: toggle
    styles:
      card:
        - padding: 12px 16px
        - border-radius: 12px
  jac_badge:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    styles:
      card:
        - padding: 10px
        - border-radius: 12px
  jac_badge_toggle:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: toggle
    styles:
      card:
        - padding: 10px
        - border-radius: 12px
views:
- title: Jacuzzi
  path: jacuzzi
  icon: mdi:hot-tub
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: markdown
      grid_options:
        columns: full
      title: Hoe de regeling werkt
      content: '**Warmtevraag** ontstaat onder doel − vraag-marge; een
        lopende run stookt door tot doel + doorstook — de KUIP-meting is
        leidend (de inlaat leest altijd te laag). HA zet dan de
        circulatiepomp aan; de Poolex start de compressor zelf zodra er
        flow is. Na een vraag-stop volgt een meng-check: 6 min
        circuleren + jets, dan de bulk evalueren.

        **Hoe de Poolex zelf regelt**: het getal op de Poolex-thermostaat is de *water*temperatuur
        die de unit nastreeft (gemeten op de inlaat). Compressor loopt tot het water
        het setpoint bereikt (+hysterese), start weer als het te ver onder het setpoint
        zakt. Zonder flow geen compressor — de interne flow-beveiliging (d1-fout)
        grijpt anders in. Bij koude buitenlucht vriest de verdamper toe; de unit draait
        dan kort terug (defrost: ventilator uit, uitlaat-temp dip) — dat is normaal
        en geen storing.

        **Piekblokkade**: tussen start/einde → setpoint 15 °C + Watercare Super Savings.
        PV-overschot ≥ drempel gedurende 10 min → vervroegd einde. De blokkade herstelt
        zichzelf ook als HA een grens mist.

        **Poolex altijd aan**: buiten de piek wordt hvac ''off'' na 60 s teruggezet
        naar heat — vorstbeveiliging van de unit werkt alleen in standby. Zet deze
        switch uit bij onderhoud/winterstalling.

        **Failsafe**: compressor aan zonder flow → pomp direct weer aan. De hardware
        flow-beveiliging van de Poolex blijft altijd achtervang.

        **Meng-puls**: zolang de compressor stookt gaat elke 30 min kort (60 s) een
        massagepomp aan — afwisselend pomp 1 en 2. Mengt de warme/koude lagen zodat
        kuip- en inlaat-sensor de echte bulk-temperatuur zien en de warmtevraag niet
        te vroeg stopt.

        **Advies**: "Advies doorstook" simuleert de vraag-cyclus (stoken → koelen →
        volgende run) met de huidige doorstook en de geleerde stook-/afkoelsnelheid
        tot de piekblokkade — en rekent welke doorstook de laatste stop vóór de
        blokkade nodig heeft om om piek-einde nog op doel uit te komen. Attributen
        tonen de gesimuleerde laatste stop, de bulk bij blokkade-start en de
        landing op piek-einde met de huidige instelling.
        "Verwachte temp piek-einde" toont dezelfde voorspelling in °C. Beide
        adviseren alleen; zelf instellen in "Doorstook".

        **Onderhoud**: zet alle automatiseringen uit — Poolex off, watercare op standby/away,
        pompen uit. Handig bij water verversen. De oude standen worden bij uitschakelen
        teruggezet. Let op: de Gecko-pack doet zelf flow-checks — bij een lege kuip
        moet de groep uit in de meterkast.'
  - type: grid
    title: Regeling
    cards:
    - type: thermostat
      grid_options:
        columns: full
      entity: climate.jacuzzi_tub_target
      name: Kuip-doel (onze thermostaat)
    - type: vertical-stack
      grid_options:
        columns: full
      cards:
      - type: custom:button-card
        template: jac_toggle
        entity: switch.jacuzzi_maintenance
        name: Onderhoudsmodus
        tooltip: >-
          Zet alle automatiseringen uit (Poolex off, watercare
          standby/away, pompen uit) voor onderhoud. De oude standen worden
          bij uitschakelen teruggezet.
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_control_status
        name: Regelstatus
        tooltip: >-
          Wat de regeling nu doet: idle, verwarmen, meng-check,
          piekblokkade, of geblokkeerd — met de reden.
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_demand_source
        name: Meetbron vraag
        tooltip: >-
          Welke meting de warmtevraag bepaalt: kuip-sensor,
          meng-check, of geen (meting onbetrouwbaar = veilig geblokkeerd).
      - type: custom:button-card
        template: jac_row
        entity: binary_sensor.jacuzzi_heat_demand
        name: Warmtevraag actief
        tooltip: >-
          Aan = de kuip is kouder dan doel − vraag-marge en de
          regeling wil warmte. Wordt alleen uitgevoerd als er geen
          blokkade is.
      - type: custom:button-card
        template: jac_row
        entity: number.jacuzzi_heat_demand_margin
        name: Vraag-marge (start onder doel)
        tooltip: >-
          Hoeveel graden onder het doel de warmtevraag start.
          0 = meteen stoken zodra de kuip onder doel zakt. Grotere marge =
          minder vaak stoken, koudere kuip.
      - type: custom:button-card
        template: jac_row
        entity: number.jacuzzi_heat_overshoot_above_target
        name: Doorstook (stop boven doel)
        tooltip: >-
          Hoeveel graden boven het doel een run doorstookt —
          compenseert de afkoeling tot aan piek-einde. Zie "Advies
          doorstook" voor de berekende waarde.
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_overshoot_advice
        name: Advies doorstook (tot piek-einde)
        tooltip: >-
          Simuleert stoken→koelen→volgende run met de geleerde
          stook-/afkoelsnelheid tot de piekblokkade, en rekent welke
          doorstook nodig is om om piek-einde op doel te landen. Alleen
          advies — zelf instellen in "Doorstook".
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_forecast_at_peak_end
        name: Verwachte temp piek-einde
        tooltip: >-
          Voorspelde kuip-temperatuur bij het einde van de
          piekblokkade. Attributen tonen de gemeten landing (werkelijk
          vs. doel) zodra een blokkade eindigde.
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_measurement_bias
        name: Meetafwijking kuipsensor (geleerd, K)
        tooltip: >-
          Geleerde afwijking tussen kuip-sensor en echte
          bulk-temperatuur, berekend uit meng-checks.
    - type: thermostat
      grid_options:
        columns: 6
      entity: climate.jaccuzzi_thermostat_1
      name: Kuip (Gecko)
    - type: thermostat
      grid_options:
        columns: 6
      entity: climate.pool_heat_pump
      name: Poolex (actuator)
    - type: vertical-stack
      grid_options:
        columns: full
      cards:
      - type: heading
        heading: Gecko — kuip
        heading_style: title
      - type: custom:button-card
        template: jac_toggle
        entity: fan.jaccuzzi_waterfall
        name: Circulatiepomp
        tooltip: >-
          HA zet deze aan voor verwarming, meng-check en koeling.
          Klik = handmatig schakelen.
      - type: custom:button-card
        template: jac_toggle
        entity: fan.jaccuzzi_pump_1
        name: Massagepomp 1
        tooltip: >-
          Wordt gebruikt voor meng-puls en meng-check; Gecko stuurt
          hem ook zelf aan (filtratie/gebruik).
      - type: custom:button-card
        template: jac_toggle
        entity: fan.jaccuzzi_pump_2
        name: Massagepomp 2
        tooltip: >-
          Wordt gebruikt voor meng-puls en meng-check; Gecko stuurt
          hem ook zelf aan (filtratie/gebruik).
      - type: custom:button-card
        template: jac_toggle
        entity: light.jaccuzzi_light_1
        name: Verlichting
        tooltip: >-
          Kuipverlichting.
      - type: custom:button-card
        template: jac_row
        entity: select.jaccuzzi_watercare_mode
        name: Watercare
        tooltip: >-
          Gecko watercare-stand. Tijdens de piekblokkade zet de
          regeling deze op de piek-stand (Super Savings); daarna weer
          terug.
      - type: custom:button-card
        template: jac_row
        entity: binary_sensor.jaccuzzi_spa_status
        name: Spa status
        tooltip: >-
          Algemene status van het Gecko-pack (aan/standby/fout).
  - type: grid
    title: Status
    cards:
    - type: vertical-stack
      grid_options:
        columns: full
      cards:
      - type: heading
        heading: Gecko — circulatie
        heading_style: title
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          template: jac_toggle
          entity: fan.jaccuzzi_waterfall
          name: Circulatie
          tooltip: >-
            Circulatiepomp — verplaatst water door wisselaar en
            kuip.
        - type: custom:button-card
          template: jac_badge
          entity: binary_sensor.jacuzzi_pump_started_by_ha
          name: Pomp door HA
          tooltip: >-
            Aan = de circulatie draait op verzoek van deze
            regeling (geen handmatige of Gecko-cyclus).
        - type: custom:button-card
          template: jac_toggle
          entity: fan.jaccuzzi_pump_1
          name: Mengen 1
          tooltip: >-
            Massagepomp 1 — mengt warme/koude lagen.
        - type: custom:button-card
          template: jac_toggle
          entity: fan.jaccuzzi_pump_2
          name: Mengen 2
          tooltip: >-
            Massagepomp 2 — mengt warme/koude lagen.
      - type: heading
        heading: Poolex — warmtepomp
        heading_style: title
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          template: jac_badge_toggle
          entity: switch.jacuzzi_poolex_power
          name: Warmte toestaan
          tooltip: >-
            Uit = de regeling mag niet verwarmen (Poolex-setpoint
            15 °C), ongeacht de warmtevraag.
        - type: custom:button-card
          template: jac_badge
          entity: binary_sensor.jacuzzi_heat_demand
          name: Warmtevraag
          tooltip: >-
            Aan = regeling wil warmte (kuip onder doel − marge).
        - type: custom:button-card
          template: jac_badge
          entity: binary_sensor.jacuzzi_compressor_active
          name: Compressor
          tooltip: >-
            Aan = compressor draait echt (duty > 0 of actief
            gemeld). Houdt rekening met naspin.
        - type: custom:button-card
          template: jac_badge
          entity: sensor.jacuzzi_poolex_compressor
          name: Duty %
          tooltip: >-
            Compressor-vermogen zoals de Poolex rapporteert
            (0–100%).
        - type: custom:button-card
          template: jac_badge
          entity: binary_sensor.pool_heat_pump_problem
          name: Fault
          tooltip: >-
            Storingsindicatie van de Poolex, bijv. d1
            flow-beveiliging.
    - type: history-graph
      grid_options:
        columns: full
      title: Temperaturen (24 uur)
      hours_to_show: 24
      entities:
      - entity: sensor.jacuzzi_tub_temperature
        name: Kuip
      - entity: sensor.jacuzzi_poolex_inlet
        name: Wisselaar inlaat
      - entity: sensor.pool_heat_pump_outflow_temperature
        name: Uitlaat
      - entity: sensor.jacuzzi_poolex_dt
        name: ΔT (uit-in)
      - entity: sensor.pool_heat_pump_vent_temperature
        name: Heetgas
      - entity: sensor.pool_heat_pump_coil_temperature
        name: Verdamper
      - entity: sensor.pool_heat_pump_temperature_2
        name: Buiten
    - type: history-graph
      grid_options:
        columns: full
      title: Aan/uit (24 uur)
      hours_to_show: 24
      entities:
      - entity: fan.jaccuzzi_waterfall
        name: Circulatie
      - entity: fan.jaccuzzi_pump_1
        name: Massagepomp 1
      - entity: fan.jaccuzzi_pump_2
        name: Massagepomp 2
      - entity: binary_sensor.jacuzzi_pump_started_by_ha
        name: Pomp door HA
      - entity: binary_sensor.jacuzzi_heat_demand
        name: Warmtevraag
      - entity: binary_sensor.jacuzzi_water_flow
        name: Flow (pomp)
      - entity: binary_sensor.pool_heat_pump_defrost
        name: Defrost
      - entity: binary_sensor.jacuzzi_element_heating
        name: Element
      - entity: sensor.jacuzzi_poolex_fault
        name: Fout
      - entity: sensor.jacuzzi_poolex_compressor
        name: Compressor %
      - entity: sensor.jacuzzi_poolex_fan_speed
        name: Ventilator %
  - type: grid
    title: Instellingen
    cards:
    - type: vertical-stack
      grid_options:
        columns: full
      cards:
      - type: heading
        heading: Piekblokkade
        heading_style: title
      - type: custom:button-card
        template: jac_row
        entity: time.jacuzzi_peak_start
        name: Start
        tooltip: >-
          Begin van de piekblokkade — tussen start en einde wordt
          niet verwarmd (Poolex op 15 °C, Watercare op piek-stand).
      - type: custom:button-card
        template: jac_row
        entity: time.jacuzzi_peak_end
        name: Einde
        tooltip: >-
          Einde van de piekblokkade — daarna mag weer verwarmd
          worden; de landing (werkelijke temp) wordt dan vastgelegd.
      - type: custom:button-card
        template: jac_row
        entity: number.jacuzzi_solar_surplus_threshold
        name: PV-drempel
        tooltip: >-
          PV-overschot (W) dat gedurende 10 min aanhoudt → de
          piekblokkade eindigt vervroegd zodat gratis zonnewarmte wordt
          benut.
      - type: custom:button-card
        template: jac_row
        entity: select.jaccuzzi_watercare_mode
        name: Watercare (piek = Super Savings)
        tooltip: >-
          Gecko watercare-stand — tijdens de blokkade gezet op de
          piek-stand; daarna hersteld.
      - type: heading
        heading: Meng-puls
        heading_style: title
      - type: custom:button-card
        template: jac_toggle
        entity: switch.jacuzzi_mixing_pulse
        name: Actief
        tooltip: >-
          Elke interval kort een massagepomp aan tijdens verwarmen
          — mengt warme/koude lagen zodat de sensoren de echte
          bulk-temperatuur zien.
      - type: custom:button-card
        template: jac_row
        entity: number.jacuzzi_mixing_interval
        name: Interval
        tooltip: >-
          Tijd tussen meng-pulsen tijdens verwarmen.
      - type: custom:button-card
        template: jac_row
        entity: number.jacuzzi_mixing_pulse_duration
        name: Pulsduur
        tooltip: >-
          Duur van één meng-puls in seconden.
      - type: heading
        heading: Poolex — sturing
        heading_style: title
      - type: custom:button-card
        template: jac_row
        entity: select.pool_heat_pump_auxiliary_heating
        name: Bijstook (C4)
        tooltip: >-
          Poolex-instelling C4 — bijstookgedrag van de unit zelf.
      - type: custom:button-card
        template: jac_row
        entity: select.pool_heat_pump_circulation_pump
        name: Pomprelais (C8)
        tooltip: >-
          Poolex-instelling C8 — intern circulatiepomprelais.
      - type: custom:button-card
        template: jac_toggle
        entity: switch.pool_heat_pump_defrost
        name: Defrost (handmatig)
        tooltip: >-
          Handmatig een defrost-cyclus starten op de verdamper.
      - type: custom:button-card
        template: jac_row
        entity: binary_sensor.pool_heat_pump_defrost
        name: Defrost
        tooltip: >-
          Aan = defrost-cyclus actief (ventilator uit, uitlaat-temp
          dip) — normaal bij koude buitenlucht.
      - type: custom:button-card
        template: jac_row
        entity: binary_sensor.jacuzzi_element_heating
        name: Element actief
        tooltip: >-
          Aan = het interne elektrische element van de Poolex
          verwarmt mee.
      - type: custom:button-card
        template: jac_row
        entity: number.pool_heat_pump_sampling_interval
        name: Meetinterval (C9)
        tooltip: >-
          Poolex-instelling C9 — meet-/regelinterval van de unit.
      - type: custom:button-card
        template: jac_row
        entity: number.jacuzzi_inlet_sensor_compensation
        name: Inlaatcompensatie (K/K)
        tooltip: >-
          Correctiefactor voor de inlaat-sensor, die structureel
          te laag leest (slechte plaatsing/buitentemperatuur). Schat de
          echte bulk-temperatuur — wordt nooit gebruikt om warmte te
          starten.
      - type: custom:button-card
        template: jac_toggle
        entity: switch.jacuzzi_poolex_always_on
        name: Altijd aan (vorstbeveiliging)
        tooltip: >-
          Houdt de Poolex op heat i.p.v. hvac off — de
          vorstbeveiliging van de unit werkt alleen in standby. Uit alleen
          bij onderhoud/winterstalling.
      - type: heading
        heading: Verbruik
        heading_style: title
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_poolex_power_estimate
        name: Poolex vermogen (geschat)
        tooltip: >-
          Geschat opgenomen elektrisch vermogen, afgeleid van
          compressor-duty en max-vermogen.
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_heating_power
        name: Thermisch vermogen (geschat)
        tooltip: >-
          Geschat afgegeven warmtevermogen uit de stook-snelheid
          van de kuip (K/u × watermassa).
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_cop_estimate
        name: COP (geschat)
        tooltip: >-
          COP = thermisch / elektrisch vermogen. Schatting —
          afhankelijk van buitentemperatuur en meting.
      - type: custom:button-card
        template: jac_row
        entity: number.jacuzzi_poolex_max_watts
        name: Max opgenomen vermogen
        tooltip: >-
          Nominaal maximaal elektrisch vermogen van de Poolex —
          basis voor de vermogen-/COP-schattingen.
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_poolex_energy
        name: Poolex (kWh)
        tooltip: >-
          Geschat elektrisch verbruik van de Poolex (geïntegreerd
          vermogen).
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_energy
        name: Jacuzzi (kWh)
        tooltip: >-
          Geschatte warmte-energie die aan de kuip is geleverd.
      - type: custom:button-card
        template: jac_row
        entity: sensor.jacuzzi_heat_loss
        name: Warmteverlies (W/K)
        tooltip: >-
          Gemeten warmteverlies per graad verschil met buiten —
          basis voor afkoelvoorspellingen. Attributen: aantal metingen en
          het lopende meetvenster (open/uren/daling/blokkade).
    - type: history-graph
      title: Warmteverlies (W/K)
      hours_to_show: 168
      entities:
      - entity: sensor.jacuzzi_heat_loss
        name: W/K
      - entity: sensor.pool_heat_pump_temperature_2
        name: Buiten
      - entity: sensor.jacuzzi_tub_temperature
        name: Kuip
