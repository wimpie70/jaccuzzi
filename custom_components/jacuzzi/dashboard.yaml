title: Jacuzzi
views:
- title: Jacuzzi
  path: jacuzzi
  icon: mdi:hot-tub
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: markdown
      layout_options:
        grid_columns: 12
      title: Hoe de regeling werkt
      content: '**Warmtevraag** = kuip-temperatuur (Gecko) < Poolex-setpoint − 1 °C.
        Dan zet HA de circulatiepomp aan; de Poolex start de compressor zelf zodra
        er flow is. Pomp gaat uit 3 min nadat het setpoint bereikt is.

        **Hoe de Poolex zelf regelt**: het getal op de Poolex-thermostaat is de *water*temperatuur
        die de unit nastreeft (gemeten op de inlaat). Compressor loopt tot het water
        het setpoint bereikt (+hysterese), start weer als het te ver onder het setpoint
        zakt. Zonder flow geen compressor — de interne flow-beveiliging (d1-fout)
        grijpt anders in. Bij koude buitenlucht vriest de verdamper toe; de unit draait
        dan kort terug (defrost: ventilator uit, uitlaat-temp dip) — dat is normaal
        en geen storing.

        **Piekblokkade**: tussen start/einde → setpoint 15 °C + Watercare Super Savings.
        PV-overschot ≥ drempel gedurende 10 min → vervroegd einde. De blokkade herstelt
        zichzelf ook als HA een grens mist.

        **Poolex altijd aan**: buiten de piek wordt hvac ''off'' na 60 s teruggezet
        naar heat — vorstbeveiliging van de unit werkt alleen in standby. Zet deze
        switch uit bij onderhoud/winterstalling.

        **Failsafe**: compressor aan zonder flow → pomp direct weer aan. De hardware
        flow-beveiliging van de Poolex blijft altijd achtervang.

        **Meng-puls**: zolang de compressor stookt gaat elke 30 min kort (60 s) een
        massagepomp aan — afwisselend pomp 1 en 2. Mengt de warme/koude lagen zodat
        kuip- en inlaat-sensor de echte bulk-temperatuur zien en de warmtevraag niet
        te vroeg stopt.

        **Onderhoud**: zet alle automatiseringen uit — Poolex off, watercare op standby/away,
        pompen uit. Handig bij water verversen. De oude standen worden bij uitschakelen
        teruggezet. Let op: de Gecko-pack doet zelf flow-checks — bij een lege kuip
        moet de groep uit in de meterkast.'
  - type: grid
    title: Regeling
    cards:
    - type: entities
      layout_options:
        grid_columns: 12
      title: Onderhoud
      entities:
      - entity: switch.jacuzzi_maintenance
