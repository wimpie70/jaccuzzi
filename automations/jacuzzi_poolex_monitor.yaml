# Monitor: twee detectiepaden
# 1. binary_sensor.pool_heat_pump_problem — echte fault-bit (tuya-local,
#    zat niet in het cloud-schema)
# 2. proxy: Poolex "wil" verwarmen (aan + water te koud) maar compressor
#    blijft 0 → vrijwel zeker een flow-error (of andere fault)
# Stuurt een notificatie; pas 'notify.-service aan naar jouw device.

- alias: "Jacuzzi - Poolex meldt probleem (fault-bit)"
  triggers:
    - trigger: state
      entity_id: binary_sensor.pool_heat_pump_problem
      to: "on"
      for: "00:01:00"
  actions:
    - action: notify.notify
      data:
        title: "Jacuzzi: Poolex fault"
        message: >-
          De Poolex rapporteert een probleem (problem-sensor aan).
          Check de unit / het display — bij d1: te weinig doorstroom,
          bypass-kraan verder dichtknijpen.

- alias: "Jacuzzi - Poolex warmtevraag zonder compressor (flow-error?)"
  triggers:
    - trigger: template
      value_template: >-
        {{ not is_state('climate.pool_heat_pump','off')
           and states('sensor.pool_heat_pump_compressor_duty_cycle')|float(0) == 0
           and state_attr('climate.jaccuzzi_thermostat_1','current_temperature')|float(99)
               < state_attr('climate.pool_heat_pump','temperature')|float(38) - 1.0 }}
      for: "00:10:00"      # 10 min warmtevraag zonder compressor = verdacht
  actions:
    - action: notify.notify
      data:
        title: "Jacuzzi: Poolex mogelijk in storing"
        message: >-
          De warmtepomp staat aan en het water is te koud
          ({{ state_attr('climate.jaccuzzi_thermostat_1','current_temperature') }} °C),
          maar de compressor draait niet — waarschijnlijk een flow-error.
          Draait de circulatiepomp? Check de unit.
