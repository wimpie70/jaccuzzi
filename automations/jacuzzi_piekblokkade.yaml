# Kookpiek-blokkade: Poolex uit tijdens 16:30-20:00

- alias: "Jacuzzi - piekblokkade AAN (16:30)"
  triggers:
    - trigger: time
      at: "16:30:00"
  actions:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.pool_heat_pump
      data:
        hvac_mode: "off"
    # Extra slot op de deur: Watercare beperkt ook de bijstook
    - action: select.select_option
      target:
        entity_id: select.jaccuzzi_watercare_mode
      data:
        option: "Super Savings"

- alias: "Jacuzzi - piekblokkade UIT (20:00)"
  triggers:
    - trigger: time
      at: "20:00:00"
  actions:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.pool_heat_pump
      data:
        hvac_mode: "heat"
    - action: select.select_option
      target:
        entity_id: select.jaccuzzi_watercare_mode
      data:
        option: "Savings"
