# Circulatiepomp-aansturing o.b.v. echte kuip-temperatuur (Gecko climate-attr)
# vs Poolex-setpoint. input_boolean voorkomt conflict met Gecko-filtercycli.
#
# LET OP: fan.jaccuzzi_waterfall = vermoedelijk de circulatiepomp — verifieer!

- alias: "Jacuzzi - circulatiepomp AAN bij warmtevraag"
  triggers:
    - trigger: template
      value_template: >-
        {{ state_attr('climate.jaccuzzi_thermostat_1','current_temperature')|float(99) <
           states('number.pool_heat_pump_temperature')|float(38) - 1.0 }}
    - trigger: state
      entity_id: switch.pool_heat_pump_switch
      to: "on"
  conditions:
    - condition: state
      entity_id: switch.pool_heat_pump_switch
      state: "on"
    - condition: template
      value_template: >-
        {{ state_attr('climate.jaccuzzi_thermostat_1','current_temperature')|float(99) <
           states('number.pool_heat_pump_temperature')|float(38) - 1.0 }}
  actions:
    - action: fan.turn_on
      target:
        entity_id: fan.jaccuzzi_waterfall
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.jacuzzi_pomp_door_ha

- alias: "Jacuzzi - circulatiepomp UIT bij setpoint bereikt"
  triggers:
    - trigger: template
      value_template: >-
        {{ state_attr('climate.jaccuzzi_thermostat_1','current_temperature')|float(99) >=
           states('number.pool_heat_pump_temperature')|float(38) }}
      for: "00:03:00"      # nadraaitijd
    - trigger: state
      entity_id: switch.pool_heat_pump_switch
      to: "off"
      for: "00:03:00"
  conditions:
    - condition: state
      entity_id: input_boolean.jacuzzi_pomp_door_ha
      state: "on"          # alleen uit als WIJ hem hebben aangezet
  actions:
    - action: fan.turn_off
      target:
        entity_id: fan.jaccuzzi_waterfall
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.jacuzzi_pomp_door_ha
